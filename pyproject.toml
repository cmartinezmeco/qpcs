[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qpcs-qkd"
version = "0.1.0"
description = "QPCS - Modulo 1: QKD (BB84) + QRNG + Eve"
requires-python = ">=3.11,<3.12"
dependencies = []
# Las dependencias reales (qiskit, numpy...) viven en requirements.txt en la
# raiz del repo, que es lo que instala el Dockerfile. Este pyproject.toml solo
# existe para que "qkd" sea un paquete instalable en modo editable y para
# centralizar la config de black/ruff/mypy/pytest.

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
# Al principio habra muchos NotImplementedError sin implementar del todo;
# eso no rompe mypy porque los tipos de las firmas ya son correctos.

[[tool.mypy.overrides]]
module = ["qiskit.*", "qiskit_aer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lentos (barridos grandes). No se ejecutan en cada push, solo al mergear a main.",
]

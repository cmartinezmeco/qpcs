[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# El nombre se queda en "qpcs-qkd" aunque desde la Fase 2 el paquete instale
# tambien src/pqc: cambiarlo renombra la distribucion instalada y deja un
# .egg-info huerfano en cada entorno ya creado, a cambio de nada. Lo que si
# habia que corregir es la descripcion, que seguia anunciando solo el Modulo 1.
name = "qpcs-qkd"
version = "0.1.0"
description = "QPCS - Modulo 1 (QKD/BB84 + QRNG), Modulo 2 (PQC real + Shor) y Modulo 3 (caos determinista)"
requires-python = ">=3.11,<3.12"
dependencies = []
# Las dependencias reales (qiskit, numpy...) viven en requirements.txt en la
# raiz del repo, que es lo que instala el Dockerfile. Este pyproject.toml solo
# existe para que "qkd", "pqc" y "chaos" sean paquetes instalables en modo
# editable (packages.find sobre src/ los coge los tres) y para centralizar la
# config de black/ruff/mypy/pytest.

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
# Al principio habra muchos NotImplementedError sin implementar del todo;
# eso no rompe mypy porque los tipos de las firmas ya son correctos.

[[tool.mypy.overrides]]
# Librerias sin stubs de tipos publicados. scipy se anadio en la tarea 1.6
# (matmul_toeplitz); oqs (liboqs-python) en la Fase 2 (modulo pqc: kem.py y
# sig.py lo importan para ML-KEM / ML-DSA en crudo).
module = ["qiskit.*", "qiskit_aer.*", "scipy.*", "oqs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lentos (barridos grandes). No se ejecutan en cada push, solo al mergear a main.",
]

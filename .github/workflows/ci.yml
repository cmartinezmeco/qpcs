name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Construccion semanal SIN cache (tarea 4.14). La cache de Buildx puede
    # esconder un fallo real (ver el comentario del paso "Build image (con
    # cache)" mas abajo): si una dependencia sin version fijada desaparece
    # de su indice, una cache de dias antes lo tapa. Este job corre en
    # limpio cada semana para destaparlo antes de que lo haga un PR.
    - cron: "0 4 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # MIGRACION A DOCKER (Fase 2, tarea 2.1). Hasta ahora la CI instalaba
      # requirements-qkd.txt (un subconjunto minimo) en el runner para no tener
      # que compilar liboqs. El modulo 2 (PQC) depende de liboqs, que es una
      # libreria en C SIN wheel: hay que compilarla. Replicar ese build en el
      # runner duplicaria la logica del Dockerfile y acabaria divergiendo de
      # el. El Dockerfile ya es la fuente de verdad del proyecto ("si funciona
      # en Docker, funciona") e instala requirements.txt + requirements-dev.txt
      # completos (liboqs-python, cryptography, qiskit, ruff/black/mypy...), asi
      # que la CI ahora construye esa imagen y corre TODO dentro de ella. Por
      # eso desaparece requirements-qkd.txt.
      # TAREA 4.14: caché de Docker en la CI (issue #36, deuda I1 desde la
      # Fase 2). Cada ejecución recompilaba liboqs desde cero: 9-16 min por
      # PR. Buildx con cache-from/cache-to type=gha reutiliza las capas del
      # cache de GitHub Actions entre ejecuciones.
      #
      # LA CACHE PUEDE ESCONDER UN FALLO REAL: liboqs-python 0.14.1
      # desapareció de PyPI en su día y la CI de una máquina siguió en verde
      # porque Docker reutilizaba una capa cacheada de días antes. Por eso
      # esta caché se añade JUNTO CON el job build-limpio de abajo
      # (--no-cache, semanal), nunca la primera sin el segundo.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (con cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: qpcs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # HALLAZGO DE LA TAREA 4.14: pyproject.toml tiene [tool.ruff] configurado
      # desde el principio del proyecto, pero nunca hubo un paso de CI que lo
      # ejecutara. Ni una sola vez. Es mas grave que el hallazgo N2 de la
      # auditoria del Modulo 2 (que solo señalaba que ruff no cubria scripts/
      # ni dashboard/): en realidad no cubria nada, ni siquiera src/. El
      # arbol ya estaba limpio al comprobarlo (con la excepcion de dos avisos
      # en scripts/make_detector_theory_figs.py, corregidos en el mismo PR
      # que añade este paso), asi que activarlo no rompe nada retroactivamente
      # - pero a partir de aqui, cualquier violacion futura si para la CI.
      - name: Ruff (lint)
        run: docker run --rm qpcs:ci ruff check src/ tests/ scripts/ dashboard/

      # scripts/ y dashboard/ entran en ruff y black (no en mypy). Eran 1200
      # lineas sin lint ni formato verificado, justo las dos piezas que la
      # documentacion admite no haber leido linea a linea, y donde vivia un
      # KeyError latente en _imprimir_tabla. Se quedan FUERA de mypy a
      # proposito: streamlit y pandas en modo strict piden un andamiaje de
      # tipos que no compensa para un fichero de presentacion.
      - name: Black (format check)
        run: docker run --rm qpcs:ci black --check src/ tests/ scripts/ dashboard/

      - name: Mypy (strict types)
        run: docker run --rm qpcs:ci mypy --strict src/qkd src/pqc src/chaos src/detector

      # --cov=src/pqc,src/chaos,src/detector y NUNCA --cov=src: el umbral
      # es el criterio de cierre de los MODULOS 2, 3 y 4. Medir src/ entero
      # impondria un minimo a la Fase 1, que esta cerrada y no es objeto de
      # este umbral. El modulo 4 arranca aqui con --cov-fail-under=85 desde
      # la tarea 4.1, mismo patron que el modulo 3.
      - name: Pytest (fast suite + coverage de los modulos 2, 3 y 4)
        run: >
          docker run --rm qpcs:ci pytest tests/ -v -m "not slow"
          --cov=src/pqc --cov=src/chaos --cov=src/detector --cov-report=term-missing --cov-fail-under=85

      # El unico test marcado `slow` del repositorio valida el benchmark
      # publicable: que la capa "+carga" nunca salga mas rapida que la
      # primitiva, que el keygen de RSA sea ordenes de magnitud mas caro que el
      # de ML-KEM y que ninguna fila tenga sigma exactamente 0. Tanto su propio
      # docstring como pyproject.toml decian que se ejecuta "al mergear a
      # main", pero no habia ningun paso que lo hiciera: no se habia ejecutado
      # automaticamente nunca. Cuesta ~45 s y solo corre en push a main, no en
      # cada PR, que es lo que aquellas dos frases prometian.
      - name: Pytest (suite lenta, solo en main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker run --rm qpcs:ci pytest tests/ -v -m "slow"

      # DETERMINISMO DEL MODULO 3 (Fase 3, tarea 3.9). Es EL paso de CI de
      # este modulo, y protege contra el unico fallo del capitulo 4 de la guia
      # que es a la vez catastrofico y silencioso: que la orbita en coma
      # flotante salga distinta en dos entornos. Cuando eso pasa no hay
      # excepcion ni aviso, sale una imagen que parece ruido -que es
      # exactamente lo que sale cuando el descifrado funciona bien y tambien
      # cuando no se ha descifrado-, asi que un test de "cifrar y descifrar en
      # la misma ejecucion" nunca lo veria.
      #
      # El script regenera el keystream DENTRO del contenedor y lo contrasta
      # con vectors/keystream_v1.json, que se genero fuera y esta versionado:
      # el vector ES el otro entorno, congelado en el repositorio. Comprueba
      # ademas las constantes del contrato (cambiar TRANSITORIO o SUBMUESTREO
      # sin cambiar de version del vector se para aqui) y la huella de la
      # cadena COMPLETA de cifrado con los dos sistemas, que el vector no
      # cubre: se puede romper el troceado del keystream o el orden de las dos
      # pasadas de difusion sin tocar un solo byte del keystream.
      #
      # Para el cruce local/contenedor a mano (el que hacen las tres maquinas
      # del equipo antes de un merge) el mismo script tiene --json:
      #   python scripts/check_chaos_determinism.py --json > /tmp/local.json
      #   docker run --rm -v "$PWD":/app qpcs:ci \
      #     python scripts/check_chaos_determinism.py --json > /tmp/dentro.json
      #   diff /tmp/local.json /tmp/dentro.json
      - name: Determinismo del modulo 3 (keystream y cadena completa)
        run: docker run --rm qpcs:ci python scripts/check_chaos_determinism.py

      # El tercer gemelo de los dos pasos de figuras de abajo, para el modulo
      # 3. Aqui la reproducibilidad es todavia mas exigible que en los otros
      # dos modulos: las cuatro figuras y el GIF salen de un cifrado que es
      # determinista POR CONTRATO, asi que un PNG que cambie de MD5 no es un
      # detalle de dibujo, es un sintoma de que la cadena de cifrado ha dejado
      # de producir los mismos bytes. Comprobado antes de anadir el paso: los
      # cinco ficheros salen identicos en el venv local y en el contenedor.
      - name: Figuras del caos reproducibles bit a bit
        run: |
          docker run --rm qpcs:ci bash -c '
            set -e
            cd /app
            md5sum docs/img/chaos_bifurcacion.png \
                   docs/img/chaos_cadena.png \
                   docs/img/chaos_correlacion.png \
                   docs/img/chaos_atractor.png \
                   docs/img/chaos_cifrado.gif > /tmp/figuras_chaos.md5
            python scripts/make_chaos_plots.py
            md5sum -c /tmp/figuras_chaos.md5
          '

      # MEJORA E1: la reproducibilidad "bit a bit" de las tres figuras del
      # modulo 1 era una comprobacion MANUAL, hecha una vez y a mano. Aqui
      # pasa a ser una garantia continua: se regeneran las figuras DENTRO de
      # la imagen (el entorno oficial: Python 3.11 y dependencias pineadas) y
      # se exige que los PNG resultantes tengan el mismo MD5 que los
      # versionados en docs/img/. Si un cambio rompe el determinismo -una
      # semilla que se pierde, un sorteo que cambia de orden- la CI se pone
      # roja en el mismo PR, en vez de descubrirse al regenerar las figuras
      # meses despues. Se ejecuta sobre la copia del repo que vive dentro del
      # contenedor: no modifica nada del arbol de trabajo.
      - name: Figuras QKD reproducibles bit a bit
        run: |
          docker run --rm qpcs:ci bash -c '
            set -e
            cd /app
            md5sum docs/img/qber_vs_eve.png \
                   docs/img/qrng_histograma.png \
                   docs/img/embudo_de_bits.png > /tmp/figuras.md5
            python scripts/make_qkd_plots.py
            md5sum -c /tmp/figuras.md5
          '

      # El gemelo del paso anterior para el modulo 2, que no lo tenia. Las tres
      # figuras de la Fase 2 son igual de deterministas que las de la Fase 1:
      # las de tiempos y tamanos se dibujan del JSON versionado y la de Shor
      # lleva SEMILLA = 42 fija. La asimetria no tenia razon tecnica.
      #
      # SIN --medir a proposito: asi el script solo lee docs/benchmark_pqc.json
      # y redibuja. Con --medir volveria a medir dentro del runner (cifras de
      # otra maquina, un minuto de CPU) y reescribiria el JSON, que es
      # justamente lo que no debe pasar en una comprobacion de reproducibilidad.
      #
      # Es un paso INDEPENDIENTE del de la Fase 1: no toca sus tres ficheros ni
      # su comando. Si alguna vez se pone rojo, el fallo esta en el modulo 2.
      - name: Figuras PQC reproducibles bit a bit
        run: |
          docker run --rm qpcs:ci bash -c '
            set -e
            cd /app
            md5sum docs/img/pqc_tiempos.png \
                   docs/img/pqc_tamanos.png \
                   docs/img/shor_fase.png > /tmp/figuras_pqc.md5
            python scripts/make_pqc_plots.py
            md5sum -c /tmp/figuras_pqc.md5
          '

      # TAREA 4.14: el arranque rapido del README (seccion "Quick start") nunca
      # se habia probado de forma automatica, y al probarlo aqui aparecio un
      # bug real: el CMD por defecto del Dockerfile era "python main.py" (un
      # placeholder desde el primer commit, Fase 1) en vez de Streamlit, asi
      # que el paso 4 del Quick Start ("docker run --rm -it -p 8501:8501
      # qpcs", sin comando explicito) NO levantaba el dashboard. Corregido en
      # el mismo PR (ver Dockerfile). El comando de aqui es LITERAL el del
      # README, sin -it (exige una TTY que no hay en el runner). Se lanza en
      # segundo plano, se espera a que Streamlit responda en /_stcore/health
      # (su endpoint de salud interno) con un timeout, y se para el
      # contenedor al final pase lo que pase.
      - name: Arranque rapido del README (el dashboard responde)
        run: |
          docker run --rm -d -p 8501:8501 --name qpcs-arranque-rapido qpcs:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health > /dev/null 2>&1; then
              echo "Dashboard responde tras ${i}s"
              docker stop qpcs-arranque-rapido
              exit 0
            fi
            sleep 1
          done
          echo "El dashboard no respondio en 30s"
          docker logs qpcs-arranque-rapido
          docker stop qpcs-arranque-rapido
          exit 1

      # TAREA 4.14: el README nunca se comprobaba automaticamente. Solo
      # enlaces relativos (internos al repo); los http(s) externos se dejan
      # fuera a proposito, para no depender de la disponibilidad de sitios de
      # terceros ni de rate limits.
      - name: Enlaces del README resuelven a ficheros que existen
        run: bash scripts/check_enlaces_readme.sh

      # TAREA 4.14: la regla de oro (D1, tarea 4.11) pasa de comprobacion
      # manual a paso de CI. El script vive en scripts/check_regla_de_oro.sh
      # (no embebido aqui: era shell anidado dentro de docker dentro de YAML,
      # dificil de leer y de probar). Corre directo en el runner porque solo
      # toca ficheros de texto ya presentes tras el checkout, no hace falta
      # el contenedor.
      - name: Regla de oro (tests citados en la teoria existen de verdad)
        run: bash scripts/check_regla_de_oro.sh

      # TAREA 4.14: gemelo de los pasos de figuras de arriba, para el Modulo
      # 4, que no lo tenia. OJO, asimetria real y documentada: de las cuatro
      # figuras del modulo, tres son deterministas (detector_espectro.png,
      # detector_filtro.png, detector_estimadores.png) pero detector_embudo.png
      # (fig. 3) NO lo es -su propio docstring en make_detector_plots.py lo
      # dice: la semilla de Toeplitz es de os.urandom sin sembrar, decision
      # consciente de la guia cap. 4.4-. Comparar esa por MD5 pondria la CI
      # roja al azar. El script se ejecuta igualmente (si revienta, el paso
      # falla: eso ya cubre "se regenera sin reventar"), pero detector_embudo.png
      # queda fuera de la lista que se compara por MD5.
      #
      # Los dos esquemas de teoria (detector_cadena_lectura.png,
      # detector_estrategia.png, tarea 4.10) SI son deterministas -son
      # diagramas sin datos, sin RNG- y entran en el MD5 estricto.
      - name: Figuras del detector reproducibles bit a bit (menos el embudo)
        run: |
          docker run --rm qpcs:ci bash -c '
            set -e
            cd /app
            md5sum docs/img/detector_espectro.png \
                   docs/img/detector_filtro.png \
                   docs/img/detector_estimadores.png \
                   docs/img/detector_cadena_lectura.png \
                   docs/img/detector_estrategia.png > /tmp/figuras_detector.md5
            python scripts/make_detector_plots.py
            python scripts/make_detector_theory_figs.py
            md5sum -c /tmp/figuras_detector.md5
          '

  build-limpio:
    # Companero del cache de arriba: mismo PR, nunca uno sin el otro (ver el
    # comentario de "Build image (con cache)"). Corre solo en el disparador
    # schedule, no en cada PR/push -si corriera siempre no aportaria nada
    # sobre el job "test", que ya construye la imagen.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (sin cache, para destapar lo que la cache esconde)
        run: docker build --no-cache -t qpcs:limpio .

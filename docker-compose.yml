# docker-compose.yml — tarea 1.9 (Carlos, Fase 1), ampliado en la 4.15.
# Tres servicios sobre la MISMA imagen del Dockerfile. Solo "app" arranca
# con "up"; "test" y "figuras" llevan profiles: ["herramientas"] a proposito
# (hallazgo post-4.15: sin eso, "docker compose up" a secas lanzaba los tres
# a la vez) y solo se activan si se invocan por su nombre:
#
#   docker compose up               -> el dashboard en localhost:8501
#   docker compose run --rm test    -> solo la suite de tests, y sale
#   docker compose run --rm figuras -> regenera las 17 figuras y sale
services:
  app:
    build: .
    ports:
      - "8501:8501"
    # --server.address=0.0.0.0 es OBLIGATORIO: con el localhost por defecto
    # el contenedor escucha solo dentro de si mismo y desde el navegador del
    # anfitrion no se ve nada aunque el puerto este publicado (la causa del
    # 90% de los "a mi no me funciona el dashboard", seccion 5.9 de la guia).
    command: >
      streamlit run dashboard/qkd_app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true

  test:
    build: .
    # HALLAZGO (post 4.15): sin "profiles", "docker compose up" a secas
    # arrancaba los TRES servicios a la vez (test y figuras terminan solos,
    # pero durante ese rato comparten log con app y confunden). El perfil
    # "herramientas" hace que test y figuras SOLO se activen si se invocan
    # explicitamente con "run --rm <servicio>", que es como se documentan
    # en el README. "docker compose run" activa el profile del servicio
    # apuntado automaticamente, sin necesidad de --profile (comportamiento
    # documentado de Compose): la orden del README sigue funcionando igual.
    profiles: ["herramientas"]
    # La suite rapida, igual que la CI (los tests slow solo en main).
    command: pytest tests/ -m "not slow"

  # TAREA 4.15: tercer servicio, regenera las figuras de los CUATRO modulos
  # con un solo comando. Sin --medir en make_pqc_plots.py: solo redibuja del
  # JSON versionado, no vuelve a medir tiempos dentro del contenedor (eso
  # daria cifras de esta maquina, no las publicadas). Monta el repo como
  # volumen para que los PNG/GIF regenerados aparezcan en docs/img/ del
  # host, no solo dentro del contenedor efimero.
  figuras:
    build: .
    profiles: ["herramientas"]
    volumes:
      - .:/app
    command: >
      bash -c "
      python scripts/make_qkd_plots.py &&
      python scripts/make_pqc_plots.py &&
      python scripts/make_chaos_plots.py &&
      python scripts/make_detector_plots.py &&
      python scripts/make_detector_theory_figs.py
      "
